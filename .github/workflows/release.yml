name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version (initial for the first release)
        required: true
        default: patch
        type: choice
        options: [initial, patch, minor, major]
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm audit --omit=dev
      - name: Prepare version and release notes
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          node scripts/release.js "$RELEASE_TYPE"
          npm run format
          npm run check
          echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=$(node -p 'require("./gladys-assistant-integration.json").docker_image')" >> "$GITHUB_OUTPUT"
      - name: Create local release commit
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json gladys-assistant-integration.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "Release $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build from the prepared files. The public manifest is only advanced AFTER the image exists.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=MIT
      - name: Publish commit, tag and GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --atomic origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md
